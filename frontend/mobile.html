<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>J.A.R.V.I.S.</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#faf3ea">
    <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
    <div id="app-shell">
        <header id="topbar">
            <div id="topbar-left">
                <div id="app-title">Jarvis</div>
                <div id="status">verbunden</div>
            </div>
            <div id="topbar-icons">
                <button id="icon-reset" class="icon-btn" aria-label="Neu starten">
                    <svg viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 6.3 17.7M4 21v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button id="icon-camera" class="icon-btn" aria-label="Kamera">
                    <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.5A1.5 1.5 0 0 1 9.4 4h5.2a1.5 1.5 0 0 1 1.3.75L16.8 6H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button id="icon-text" class="icon-btn" aria-label="Text-Eingabe">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <main id="voice-view" class="tab-view active">
            <div id="orb-wrap">
                <canvas id="orb-canvas"></canvas>
            </div>

            <div id="chat-scroll"><div id="chat-log"></div></div>

            <div id="text-row" class="hidden">
                <input id="mobile-text" type="text" placeholder="Nachricht an Jarvis..." autocomplete="off">
                <button id="mobile-send" aria-label="Senden">➤</button>
            </div>

            <div id="call-controls">
                <button id="mobile-hangup" aria-label="Auflegen">Auflegen</button>
                <button id="mobile-talk" aria-label="Halten zum Sprechen">
                    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <button id="mobile-enable-push" aria-label="Benachrichtigungen aktivieren">🔔 Benachrichtigungen aktivieren</button>
        </main>

        <div id="cockpit-view" class="tab-view">
            <iframe id="cockpit-frame" src="/cockpit" title="Cockpit"></iframe>
        </div>

        <nav id="tabbar">
            <button class="tab-btn active" data-tab="voice">
                <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Voice</span>
            </button>
            <button class="tab-btn" data-tab="cockpit">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Cockpit</span>
            </button>
        </nav>
    </div>

    <div id="camera-overlay" class="hidden">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="camera-canvas" class="hidden"></canvas>
        <div id="camera-result"></div>
        <button id="camera-close" aria-label="Kamera schliessen">✕</button>
    </div>

    <script type="module" src="/static/orb.js"></script>
    <script src="/static/mobile.js" defer></script>
</body>
</html>
